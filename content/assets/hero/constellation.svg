<svg xmlns="http://www.w3.org/2000/svg" width="520" height="470" viewBox="0 0 420 380" fill="none"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Sorted</title>
  <desc id="hero-desc">Six category chips — food, investments, bills, transport, health and shopping — arranged around a rupee symbol and joined to it by dotted connector lines.</desc>

  <!-- ── connectors ──────────────────────────────────────────────
       1.6px ink, dash 4 6, round caps. This exact stroke is reused as
       the tether: the mark for "a connection did this, not you."
       Drawn first so the chips and core sit on top of the line ends. -->
  <g id="hero-links" stroke="#1A1A1A" stroke-width="1.6" stroke-dasharray="4 6" stroke-linecap="round">
    <path d="M208 126 L206 82"/>
    <path d="M267 161 L325 132"/>
    <path d="M266 221 L324 253"/>
    <path d="M212 254 L213 306"/>
    <path d="M156 224 L91 266"/>
    <path d="M153 162 L85 129"/>
  </g>

  <!-- ── core ────────────────────────────────────────────────────
       Cream fill on cream field, held by a 4.5px ink stroke. The rupee is
       set in the display face so the hero and the wordmark share one voice.
       Path fallback is not supplied: if Bricolage Grotesque fails to load the
       browser substitutes a grotesk ₹, which is still correct at this size. -->
  <g id="hero-core">
    <circle cx="210" cy="190" r="64" fill="#FAF5F2" stroke="#1A1A1A" stroke-width="4.5"/>
    <text x="210" y="215" text-anchor="middle" font-family="Bricolage Grotesque, Geist, system-ui, sans-serif"
          font-weight="800" font-size="66" fill="#1A1A1A">&#8377;</text>
  </g>

  <!-- ── chips ───────────────────────────────────────────────────
       r=30 at 4px stroke — the chip scaled up to display weight. Order round
       the dial is fixed and matches the sidebar order, so the hero teaches the
       taxonomy before the user has seen a single transaction. -->
  <g id="hero-chips" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <g class="hc" data-cat="food" data-x="206" data-y="52">
      <circle cx="206" cy="52" r="30" fill="#F9ACCE" stroke="#1A1A1A" stroke-width="4"/>
      <g transform="translate(194 40)">
        <path d="M6 8.5h10.5v6a5.25 5.25 0 0 1-10.5 0z"/><path d="M17 10a2.9 2.9 0 0 1 0 4.5"/>
        <path d="M9 5.6V4.2M12.6 5.6V4.2"/>
      </g>
    </g>

    <g class="hc" data-cat="invest" data-x="352" data-y="118">
      <circle cx="352" cy="118" r="30" fill="#23B471" stroke="#1A1A1A" stroke-width="4"/>
      <g transform="translate(340 106)">
        <path d="M4 16.6 9.2 10l3.8 3.8L19.4 5"/><path d="M14.8 5h4.8v4.8"/>
      </g>
    </g>

    <g class="hc" data-cat="bills" data-x="350" data-y="268">
      <circle cx="350" cy="268" r="30" fill="#F1A007" stroke="#1A1A1A" stroke-width="4"/>
      <g transform="translate(338 256)">
        <path d="M13.4 3.2 6.4 13.2h4.6l-1 7.6 7.2-10.6h-4.4z"/>
      </g>
    </g>

    <g class="hc" data-cat="transport" data-x="214" data-y="336">
      <circle cx="214" cy="336" r="30" fill="#5483D3" stroke="#1A1A1A" stroke-width="4"/>
      <g transform="translate(202 324)">
        <path d="M3.6 15.6V9.4h8.8l3.9 6.2"/><path d="M3.6 15.6h13.9"/>
        <circle cx="7.4" cy="17.8" r="2.1"/><circle cx="16.2" cy="17.8" r="2.1"/>
      </g>
    </g>

    <g class="hc" data-cat="health" data-x="66" data-y="282">
      <circle cx="66" cy="282" r="30" fill="#C43C63" stroke="#1A1A1A" stroke-width="4"/>
      <g transform="translate(54 270)">
        <g transform="rotate(-40 12 12)"><rect x="3.4" y="9" width="17.2" height="6" rx="3"/><path d="M12 9v6"/></g>
      </g>
    </g>

    <g class="hc" data-cat="shopping" data-x="64" data-y="112">
      <circle cx="64" cy="112" r="30" fill="#8A4BD1" stroke="#1A1A1A" stroke-width="4"/>
      <g transform="translate(52 100)">
        <path d="M5.2 8h13.6l-1.3 12H6.5z"/><path d="M9.1 8a2.9 2.9 0 0 1 5.8 0"/>
      </g>
    </g>
  </g>
</svg>
